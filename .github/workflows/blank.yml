                      Start-Sleep -Seconds 10

                      $process = Get-Process `
                        -Name "RobloxPlayerBeta" `
                        -ErrorAction SilentlyContinue

                      if ($process) {
                          Write-Host "Roblox iniciou."
                      }
                      else {
                          Write-Warning "Roblox nao iniciou."
                      }

                      break
                  }
              }
          }

          if (-not $found) {
              Write-Host "Roblox nao esta instalado neste runner."
              Write-Host "O diagnostico de GPU acima mostra se o ambiente possui aceleracao grafica."
          }

      # ==========================================
      # 8 - RELATORIO DE JOGOS
      # ==========================================
      - name: Relatorio Grafico
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "          RELATORIO GRAFICO"
          Write-Host "=============================================="

          $gpus = Get-CimInstance Win32_VideoController

          foreach ($gpu in $gpus) {

              Write-Host ""
              Write-Host "GPU: $($gpu.Name)"
              Write-Host "Driver: $($gpu.DriverVersion)"
              Write-Host "Status: $($gpu.Status)"

              if ($gpu.Name -match "Microsoft Basic Display") {
                  Write-Warning "GPU basica detectada."
                  Write-Warning "Jogos 3D podem nao funcionar corretamente."
              }

              if ($gpu.Name -match "Remote Display") {
                  Write-Warning "Adaptador remoto detectado."
              }

              if ($gpu.Name -match "NVIDIA") {
                  Write-Host "GPU NVIDIA detectada."
              }

              if ($gpu.Name -match "RTX 3060") {
                  Write-Host "RTX 3060 detectada."
              }
          }

          Write-Host ""
          Write-Host "Se nenhuma GPU adequada aparecer acima,"
          Write-Host "o runner nao possui uma GPU gamer disponivel."

      # ==========================================
