runs-on: windows-4-core-gpuailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale nao foi instalado."
          }

          Write-Host "Tailscale instalado."

      # ==================================================
      # 5 - CONECTAR TAILSCALE
      # ==================================================
      - name: Conectar Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace(
            $env:TAILSCALE_AUTH_KEY
          )) {

            throw "TAILSCALE_AUTH_KEY nao configurado."

          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gh-gaming-$env:GITHUB_RUN_ID"

          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {

            $tsIP = (
              & $tailscale ip -4 2>$null
            ) |
              Where-Object {
                $_ -match "^\d+\.\d+\.\d+\.\d+$"
              } |
              Select-Object -First 1

            if ($tsIP) {
              break
            }

            Write-Host "Aguardando Tailscale... $i/20"

            Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
            throw "IP Tailscale nao encontrado."
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "IP Tailscale: $tsIP"

      # ==================================================
      # 6 - TESTAR RDP
      # ==================================================
      - name: Testar RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Testando RDP..."

          $service = Get-Service `
            -Name TermService

          if ($service.Status -ne "Running") {

            Start-Service `
              -Name TermService

            Start-Sleep -Seconds 3

          }

          $listening = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listening) {
            throw "Porta 3389 nao esta escutando."
          }

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
            throw "RDP nao respondeu."
          }

          Write-Host "RDP funcionando."

      # ==================================================
      # 7 - VERIFICAR ROBLOX
      # ==================================================
      - name: Verificar Roblox
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "             VERIFICANDO ROBLOX"
          Write-Host "=============================================="

          $paths = @(
            "$env:LOCALAPPDATA\Roblox\Versions",
            "$env:ProgramFiles\Roblox",
            "${env:ProgramFiles(x86)}\Roblox"
          )

          $found = $false

          foreach ($path in $paths) {

            if (Test-Path $path) {

              Write-Host "Diretorio encontrado: $path"

              $found = $true

              $exe = Get-ChildItem `
                -Path $path `
                -Filter "RobloxPlayerBeta.exe" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($exe) {

                Write-Host "Roblox encontrado:"
                Write-Host $exe.FullName

                Start-Process `
                  -FilePath $exe.FullName `
                  -ErrorAction SilentlyContinue

                Start-Sleep -Seconds 10

                $process = Get-Process `
                  -Name "RobloxPlayerBeta" `
                  -ErrorAction SilentlyContinue

                if ($process) {

                  Write-Host "Roblox iniciou."

                }
                else {

                  Write-Warning "Roblox nao iniciou."

                }

                break
              }
            }
          }

          if (-not $found) {

            Write-Host "Roblox nao esta instalado."

          }

      # ==================================================
      # 8 - MOSTRAR ACESSO
      # ==================================================
      - name: Mostrar Acesso RDP
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "                 RDP ATIVO"
