neme: Windows Cloud PC - Anydesk (Optimized) on: workflow_dispatch: jobs: build: name: Start Building... runs-on: windows-latest timeout-minutes: 10080 # MÃ¡ximo de 7 dias para evitar tempo de execuÃ§Ã£o excessivo steps: - name: Downloading & Installing Essentials run: | # Baixa o arquivo .bat para instalar componentes essenciais Invoke-WebRequest -Uri "https://www.dropbox.com/scl/fi/7eiczvgil84czu55dxep3/Downloads.bat?rlkey=wzdc1wxjsph2b7r0atplmdz3p&dl=1" -OutFile "Downloads.bat" # Executa o script .bat para instalar os componentes cmd /c Downloads.bat - name: Log In To AnyDesk run: | # Verifica se o arquivo start.bat existe antes de executar if (Test-Path "start.bat") { cmd /c start.bat } else { Write-Host "Arquivo start.bat nÃ£o encontrado. Verifique a configuraÃ§Ã£o." } - name: Monitor and Restart AnyDesk if Needed run: | # Monitora a conexÃ£o do AnyDesk e reinicia se necessÃ¡rio while ($true) { $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue if (-not $process) { Write-Host "AnyDesk nÃ£o estÃ¡ rodando, reiniciando..." cmd /c start.bat } Start-Sleep -Seconds 300 # Verifica a cada 5 minutos } - name: Time Counter (Long Running Task) run: | # Configura para manter a mÃ¡quina em execuÃ§Ã£o Start-Sleep -Seconds 604800 # 7 dias de execuÃ§Ã£o contÃ nua - name: Clean Up Temporary Files if: success() # Executa esta etapa apenas se todas as etapas anteriores forem bem-sucedidas run: | # Remove arquivos temporÃ¡rios ou logs gerados Remove-Item Downloads.bat -Force Write-Host "Limpeza completa."    for ($i = 1; $i -le 20; $i++) {

            $tsIP = (
              & $tailscale ip -4 2>$null
            ) |
              Where-Object {
                $_ -match "^\d+\.\d+\.\d+\.\d+$"
              } |
              Select-Object -First 1

            if ($tsIP) {
              break
            }

            Write-Host "Aguardando Tailscale... $i/20"

            Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
            throw "IP do Tailscale nao encontrado."
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "Tailscale IP: $tsIP"

      # ==================================================
      # 6. VERIFICAR RDP
      # ==================================================
      - name: Verificar RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $service = Get-Service `
            -Name TermService

          if ($service.Status -ne "Running") {

            Start-Service `
              -Name TermService

            Start-Sleep -Seconds 3

          }

          $port = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $port) {
            throw "Porta 3389 nao esta escutando."
          }

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
            throw "RDP nao respondeu."
          }

          Write-Host "RDP funcionando."

      # ==================================================
      # 7. VERIFICAR GPU PARA JOGOS
      # ==================================================
      - name: Verificar Ambiente Gamer
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "          AMBIENTE GAMER"
          Write-Host "=============================================="

          $gpus = Get-CimInstance Win32_VideoController

          $gamingGPU = $false

          foreach ($gpu in $gpus) {

            Write-Host ""
            Write-Host "GPU: $($gpu.Name)"

            if (
              $gpu.Name -match "NVIDIA" -or
              $gpu.Name -match "AMD" -or
              $gpu.Name -match "Radeon"
            ) {

              $gamingGPU = $true

            }

          }

          if ($gamingGPU) {

            Write-Host ""
            Write-Host "GPU para jogos detectada."

          }
          else {

            Write-Warning "GPU gamer nao detectada."
            Write-Warning "O ambiente pode nao conseguir executar jogos 3D."

          }

      # ==================================================
      # 8. VERIFICAR ROBLOX
      # ==================================================
      - name: Verificar Roblox
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "                 ROBLOX"
          Write-Host "=============================================="

          $locations = @(
            "$env:LOCALAPPDATA\Roblox",
            "$env:ProgramFiles\Roblox",
            "${env:ProgramFiles(x86)}\Roblox"
          )

          $roblox = $null

          foreach ($location in $locations) {

            if (Test-Path $location) {

              $roblox = Get-ChildItem `
                -Path $location `
                -Filter "RobloxPlayerBeta.exe" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($roblox) {
                break
              }

            }

          }

          if ($roblox) {

            Write-Host "Roblox encontrado:"
            Write-Host $roblox.FullName

          }
          else {

            Write-Host "Roblox nao esta instalado."

          }

      # ==================================================
      # 9. MOSTRAR ACESSO
      # ==================================================
      - name: Mostrar Acesso
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "             CLOUD GAMING ONLINE"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "IP Tailscale : $env:TAILSCALE_IP"
          Write-Host "Porta        : 3389"
          Write-Host "Usuario      : $env:RDP_USERNAME"
          Write-Host "Senha        : $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "Conecte usando um cliente RDP."
          Write-Host ""
          Write-Host "=============================================="
          Write-Host ""

      # ==================================================
      # 10. MANTER A SESSAO
      # ==================================================
      - name: Manter Cloud Gaming
        shell: powershell
        run: |
          Write-Host "Cloud Gaming ativo."

          while ($true) {

            $service = Get-Service `
              -Name TermService `
              -ErrorAction SilentlyContinue

            if ($service) {

              if ($service.Status -ne "Running") {

                Write-Host "RDP parado. Reiniciando..."

                Start-Service `
                  -Name TermService `
                  -ErrorAction SilentlyContinue

              }

            }

            Write-Host `
              "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Cloud Gaming ativo"

            Start-Sleep -Seconds 60
          }
