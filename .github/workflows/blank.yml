                  -ErrorAction SilentlyContinue

              }
            }

            Write-Host `
              "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP ativo"

            Start-Sleep -Seconds 60
          }    # ==========================================
      - name: Conectar Tailscale
        shell: powershell
