- name: Runner Hardware Diagnostic
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        DIAGNOSTICO DO RUNNER"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "========== WINDOWS =========="

          $os = Get-CimInstance Win32_OperatingSystem

          Write-Host "Sistema       : $($os.Caption)"
          Write-Host "Versao        : $($os.Version)"
          Write-Host "Build         : $($os.BuildNumber)"
          Write-Host "Arquitetura   : $($os.OSArchitecture)"

          Write-Host ""
          Write-Host "========== CPU =========="

          Get-CimInstance Win32_Processor |
            Select-Object Name,
                          NumberOfCores,
                          NumberOfLogicalProcessors,
                          MaxClockSpeed |
            Format-List

          Write-Host "========== RAM =========="

          $totalRAM = [math]::Round(
            $os.TotalVisibleMemorySize / 1MB,
            2
          )

          $freeRAM = [math]::Round(
            $os.FreePhysicalMemory / 1MB,
            2
          )

          $usedRAM = [math]::Round(
            $totalRAM - $freeRAM,
            2
          )

          Write-Host "RAM Total : $totalRAM GB"
          Write-Host "RAM Usada : $usedRAM GB"
          Write-Host "RAM Livre : $freeRAM GB"

          Write-Host ""
          Write-Host "========== GPU =========="

          $gpus = Get-CimInstance Win32_VideoController

          if ($gpus) {
            foreach ($gpu in $gpus) {

              $gpuRam = 0

              if ($gpu.AdapterRAM) {
                $gpuRam = [math]::Round(
                  $gpu.AdapterRAM / 1GB,
                  2
                )
              }

              Write-Host "Nome        : $($gpu.Name)"
              Write-Host "Driver      : $($gpu.DriverVersion)"
              Write-Host "Driver Date : $($gpu.DriverDate)"
              Write-Host "Video Mode  : $($gpu.VideoModeDescription)"
              Write-Host "GPU RAM     : $gpuRam GB"
              Write-Host "Status      : $($gpu.Status)"
              Write-Host ""
            }
          }
          else {
            Write-Host "Nenhuma GPU foi detectada."
          }

          Write-Host "========== DISCO =========="

          Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            Select-Object DeviceID,
              @{Name="TotalGB";Expression={
                [math]::Round($_.Size / 1GB, 2)
              }},
              @{Name="FreeGB";Expression={
                [math]::Round($_.FreeSpace / 1GB, 2)
              }} |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "========== DIRECTX =========="

          $dxdiagPath = "$env:TEMP\dxdiag.txt"

          if (Test-Path $dxdiagPath) {
            Remove-Item $dxdiagPath -Force -ErrorAction SilentlyContinue
          }

          Start-Process `
            -FilePath "dxdiag.exe" `
            -ArgumentList "/t `"$dxdiagPath`"" `
            -Wait `
            -ErrorAction SilentlyContinue

          if (Test-Path $dxdiagPath) {

            Write-Host "Relatorio DirectX criado."
            Write-Host ""

            Get-Content $dxdiagPath |
              Select-String `
                "Operating System",
                "System Model",
                "Processor",
                "Memory",
                "DirectX Version",
                "Card name",
                "Display Memory",
                "Driver Model",
                "Driver Version"
          }
          else {
            Write-Host "Nao foi possivel criar o relatorio do DirectX."
          }

          Write-Host ""
          Write-Host "========== SERVICOS =========="

          Get-Service `
            -Name TermService,
                  AudioSrv,
                  EventLog,
                  Winmgmt `
            -ErrorAction SilentlyContinue |
            Select-Object Name, Status, StartType |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "========== PROCESSOS GRAFICOS =========="

          Get-Process |
            Where-Object {
              $_.ProcessName -match "Roblox|RobloxPlayer|dwm|explorer"
            } |
            Select-Object ProcessName, Id, CPU |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       DIAGNOSTICO CONCLUIDO"
          Write-Host "==============================================". CONECTAR TAILSCALE
      # ==========================================
      - name: Establish Tailscale Connection
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY não configurado."
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {

              $tsIP = (& $tailscale ip -4 2>$null) |
                Where-Object {
                  $_ -match '^\d+\.\d+\.\d+\.\d+$'
                } |
                Select-Object -First 1

              if ($tsIP) {
                  break
              }

              Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
              throw "IP Tailscale não encontrado."
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale IP: $tsIP"

      # ==========================================
      # 6. DIAGNÓSTICO DE REDE / RDP
      # ==========================================
      - name: Network and RDP Diagnostic
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "========== REDE =========="

          ipconfig

          Write-Host ""
          Write-Host "========== TAILSCALE =========="

          & "$env:ProgramFiles\Tailscale\tailscale.exe" status

          Write-Host ""
          Write-Host "========== RDP =========="

          Get-NetTCPConnection `
            -LocalPort 3389 `
            -ErrorAction SilentlyContinue |
            Format-Table -AutoSize

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          Write-Host "TCP 3389: $($test.TcpTestSucceeded)"

          if (-not $test.TcpTestSucceeded) {
              Write-Warning "RDP não está respondendo na porta 3389."
          }

      # ==========================================
      # 7. RELATÓRIO FINAL
      # ==========================================
      - name: Gaming Environment Report
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       RELATÓRIO PARA JOGOS / ROBLOX"
          Write-Host "=============================================="

          $gpus = Get-CimInstance Win32_VideoController

          foreach ($gpu in $gpus) {

              Write-Host ""
              Write-Host "GPU: $($gpu.Name)"
              Write-Host "Driver: $($gpu.DriverVersion)"
              Write-Host "Memória: $([math]::Round($gpu.AdapterRAM / 1GB, 2)) GB"

              if ($gpu.Name -match "Microsoft Basic Display") {
                  Write-Warning "GPU básica detectada. Jogos podem não funcionar corretamente."
              }

              if ($gpu.Name -match "Remote Display") {
                  Write-Warning "Adaptador gráfico remoto detectado."
              }
          }

          Write-Host ""
          Write-Host "CPU:"
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host ""
          Write-Host "RAM:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object `
              @{N="TotalGB";E={
                [math]::Round($_.TotalVisibleMemorySize / 1MB, 2)
              }},
              @{N="FreeGB";E={
                [math]::Round($_.FreePhysicalMemory / 1MB, 2)
              }}

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        DIAGNÓSTICO CONCLUÍDO"
          Write-Host "=============================================="

      # ==========================================
      # 8. MANTER RDP ATIVO
      # ==========================================
      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "              RDP ATIVO"
          Write-Host "=============================================="
          Write-Host "Endereço : $env:TAILSCALE_IP"
          Write-Host "Usuário  : $env:RDP_USERNAME"
          Write-Host "Senha    : $env:RDP_PASSWORD"
          Write-Host "=============================================="
          Write-Host ""

          while ($true) {

              $service = Get-Service `
                -Name TermService `
                -ErrorAction SilentlyContinue

              if ($service -and $service.Status -ne "Running") {
                  Write-Host "RDP parado. Reiniciando..."
                  Start-Service TermService
              }

              Write-Host `
                "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP ativo"

              Start-Sleep -Seconds 60
          }. CONECTAR TAILSCALE
