name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ==========================================
      # 1. DIAGNÓSTICO DO HARDWARE
      # ==========================================
      - name: Runner Hardware Diagnostic
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        DIAGNÓSTICO DO RUNNER"
          Write-Host "=============================================="
          Write-Host ""

          # Windows
          Write-Host "========== WINDOWS =========="

          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber, OSArchitecture |
            Format-List

          # CPU
          Write-Host "========== CPU =========="

          Get-CimInstance Win32_Processor |
            Select-Object Name,
                          NumberOfCores,
                          NumberOfLogicalProcessors,
                          MaxClockSpeed |
            Format-List

          # RAM
          Write-Host "========== MEMÓRIA RAM =========="

          $os = Get-CimInstance Win32_OperatingSystem

          $totalRAM = [math]::Round(
            $os.TotalVisibleMemorySize / 1MB,
            2
          )

          $freeRAM = [math]::Round(
            $os.FreePhysicalMemory / 1MB,
            2
          )

          $usedRAM = [math]::Round(
            $totalRAM - $freeRAM,
            2
          )

          Write-Host "RAM Total : $totalRAM GB"
          Write-Host "RAM Usada : $usedRAM GB"
          Write-Host "RAM Livre : $freeRAM GB"

          # GPU
          Write-Host ""
          Write-Host "========== GPU =========="

          $gpus = Get-CimInstance Win32_VideoController

          if ($gpus) {

              foreach ($gpu in $gpus) {

                  Write-Host "GPU:"
                  Write-Host " Nome          : $($gpu.Name)"
                  Write-Host " Driver        : $($gpu.DriverVersion)"
                  Write-Host " Driver Date   : $($gpu.DriverDate)"
                  Write-Host " Video Mode    : $($gpu.VideoModeDescription)"
                  Write-Host " Adapter RAM   : $([math]::Round($gpu.AdapterRAM / 1GB, 2)) GB"
                  Write-Host " Status        : $($gpu.Status)"
                  Write-Host ""
              }

          }
          else {
              Write-Host "NENHUMA GPU DETECTADA."
          }

          # Monitores
          Write-Host "========== MONITORES =========="

          Get-CimInstance Win32_DesktopMonitor |
            Select-Object Name,
                          ScreenWidth,
                          ScreenHeight,
                          PNPDeviceID |
            Format-List

          # Disco
          Write-Host "========== ARMAZENAMENTO =========="

          Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            Select-Object DeviceID,
                          VolumeName,
                          @{Name="TotalGB";Expression={
                              [math]::Round($_.Size / 1GB, 2)
                          }},
                          @{Name="FreeGB";Expression={
                              [math]::Round($_.FreeSpace / 1GB, 2)
                          }} |
            Format-Table -AutoSize

          # Arquitetura
          Write-Host "========== SISTEMA =========="

          Write-Host "Computer Name : $env:COMPUTERNAME"
          Write-Host "Architecture  : $env:PROCESSOR_ARCHITECTURE"
          Write-Host "PowerShell    : $($PSVersionTable.PSVersion)"

          # Virtualização
          Write-Host ""
          Write-Host "========== VIRTUALIZAÇÃO =========="

          systeminfo | Select-String `
            "Hyper-V Requirements",
            "Virtualization",
            "VM Monitor"

          # DirectX
          Write-Host ""
          Write-Host "========== DIRECTX =========="

          $dxdiagPath = "$env:TEMP\dxdiag.txt"

          Start-Process `
            -FilePath "dxdiag.exe" `
            -ArgumentList "/t `"$dxdiagPath`"" `
            -Wait

          if (Test-Path $dxdiagPath) {

              Write-Host "Relatório DirectX criado."

              Get-Content $dxdiagPath |
                Select-String `
                  "Operating System",
                  "System Model",
                  "Processor",
                  "Memory",
                  "DirectX Version",
                  "Card name",
                  "Display Memory",
                  "Driver Model",
                  "Driver Version"
          }

          # WDDM / driver
          Write-Host ""
          Write-Host "========== DRIVER GRÁFICO =========="

          Get-CimInstance Win32_VideoController |
            Select-Object Name, DriverVersion, DriverDate, VideoProcessor |
            Format-Table -AutoSize

          # Serviços
          Write-Host ""
          Write-Host "========== SERVIÇOS =========="

          Get-Service -Name TermService,
                              AudioSrv,
                              EventLog,
                              Winmgmt `
            -ErrorAction SilentlyContinue |
            Select-Object Name, Status, StartType |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       FIM DO DIAGNÓSTICO DO HARDWARE"
          Write-Host "=============================================="

      # ==========================================
      # 2. CONFIGURAR RDP
      # ==========================================
      - name: Configure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $rdpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $tcpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'

          Set-ItemProperty `
            -Path $rdpPath `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path $tcpPath `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path $tcpPath `
            -Name 'SecurityLayer' `
            -Value 1 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          $service = Get-Service TermService

          if ($service.Status -eq "Running") {
              Restart-Service TermService -Force
          }
          else {
              Start-Service TermService
          }

          Write-Host "RDP configurado."

      # ==========================================
      # 3. CRIAR USUÁRIO
      # ==========================================
      - name: Create RDP User
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $username = "Skyro"

          $upper   = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.ToCharArray()
          $lower   = 'abcdefghijklmnopqrstuvwxyz'.ToCharArray()
          $numbers = '0123456789'.ToCharArray()
          $special = '!@#$%^&*()-_=+[]{}:,.?'.ToCharArray()

          $passwordChars = @()

          $passwordChars += $upper | Get-Random -Count 4
          $passwordChars += $lower | Get-Random -Count 4
          $passwordChars += $numbers | Get-Random -Count 4
          $passwordChars += $special | Get-Random -Count 4

          $password = -join ($passwordChars | Sort-Object { Get-Random })

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name $username
          }

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -UserMayNotChangePassword

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
              throw "Falha ao criar usuário."
          }

          "RDP_USERNAME=$username" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "RDP_PASSWORD=$password" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Usuário RDP criado."

      # ==========================================
      # 4. INSTALAR TAILSCALE
      # ==========================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              throw "Tailscale não foi instalado."
          }

      # ==========================================
      # 5. CONECTAR TAILSCALE
      # ==========================================
      - name: Establish Tailscale Connection
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY não configurado."
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {

              $tsIP = (& $tailscale ip -4 2>$null) |
                Where-Object {
                  $_ -match '^\d+\.\d+\.\d+\.\d+$'
                } |
                Select-Object -First 1

              if ($tsIP) {
                  break
              }

              Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
              throw "IP Tailscale não encontrado."
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale IP: $tsIP"

      # ==========================================
      # 6. DIAGNÓSTICO DE REDE / RDP
      # ==========================================
      - name: Network and RDP Diagnostic
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "========== REDE =========="

          ipconfig

          Write-Host ""
          Write-Host "========== TAILSCALE =========="

          & "$env:ProgramFiles\Tailscale\tailscale.exe" status

          Write-Host ""
          Write-Host "========== RDP =========="

          Get-NetTCPConnection `
            -LocalPort 3389 `
            -ErrorAction SilentlyContinue |
            Format-Table -AutoSize

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          Write-Host "TCP 3389: $($test.TcpTestSucceeded)"

          if (-not $test.TcpTestSucceeded) {
              Write-Warning "RDP não está respondendo na porta 3389."
          }

      # ==========================================
      # 7. RELATÓRIO FINAL
      # ==========================================
      - name: Gaming Environment Report
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       RELATÓRIO PARA JOGOS / ROBLOX"
          Write-Host "=============================================="

          $gpus = Get-CimInstance Win32_VideoController

          foreach ($gpu in $gpus) {

              Write-Host ""
              Write-Host "GPU: $($gpu.Name)"
              Write-Host "Driver: $($gpu.DriverVersion)"
              Write-Host "Memória: $([math]::Round($gpu.AdapterRAM / 1GB, 2)) GB"

              if ($gpu.Name -match "Microsoft Basic Display") {
                  Write-Warning "GPU básica detectada. Jogos podem não funcionar corretamente."
              }

              if ($gpu.Name -match "Remote Display") {
                  Write-Warning "Adaptador gráfico remoto detectado."
              }
          }

          Write-Host ""
          Write-Host "CPU:"
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host ""
          Write-Host "RAM:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object `
              @{N="TotalGB";E={
                [math]::Round($_.TotalVisibleMemorySize / 1MB, 2)
              }},
              @{N="FreeGB";E={
                [math]::Round($_.FreePhysicalMemory / 1MB, 2)
              }}

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        DIAGNÓSTICO CONCLUÍDO"
          Write-Host "=============================================="

      # ==========================================
      # 8. MANTER RDP ATIVO
      # ==========================================
      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "              RDP ATIVO"
          Write-Host "=============================================="
          Write-Host "Endereço : $env:TAILSCALE_IP"
          Write-Host "Usuário  : $env:RDP_USERNAME"
          Write-Host "Senha    : $env:RDP_PASSWORD"
          Write-Host "=============================================="
          Write-Host ""

          while ($true) {

              $service = Get-Service `
                -Name TermService `
                -ErrorAction SilentlyContinue

              if ($service -and $service.Status -ne "Running") {
                  Write-Host "RDP parado. Reiniciando..."
                  Start-Service TermService
              }

              Write-Host `
                "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP ativo"

              Start-Sleep -Seconds 60
          }. CONECTAR TAILSCALE
      # ==========================================
      - name: Establish Tailscale Connection
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY não configurado."
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {

              $tsIP = (& $tailscale ip -4 2>$null) |
                Where-Object {
                  $_ -match '^\d+\.\d+\.\d+\.\d+$'
                } |
                Select-Object -First 1

              if ($tsIP) {
                  break
              }

              Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
              throw "IP Tailscale não encontrado."
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale IP: $tsIP"

      # ==========================================
      # 6. DIAGNÓSTICO DE REDE / RDP
      # ==========================================
      - name: Network and RDP Diagnostic
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "========== REDE =========="

          ipconfig

          Write-Host ""
          Write-Host "========== TAILSCALE =========="

          & "$env:ProgramFiles\Tailscale\tailscale.exe" status

          Write-Host ""
          Write-Host "========== RDP =========="

          Get-NetTCPConnection `
            -LocalPort 3389 `
            -ErrorAction SilentlyContinue |
            Format-Table -AutoSize

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          Write-Host "TCP 3389: $($test.TcpTestSucceeded)"

          if (-not $test.TcpTestSucceeded) {
              Write-Warning "RDP não está respondendo na porta 3389."
          }

      # ==========================================
      # 7. RELATÓRIO FINAL
      # ==========================================
      - name: Gaming Environment Report
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       RELATÓRIO PARA JOGOS / ROBLOX"
          Write-Host "=============================================="

          $gpus = Get-CimInstance Win32_VideoController

          foreach ($gpu in $gpus) {

              Write-Host ""
              Write-Host "GPU: $($gpu.Name)"
              Write-Host "Driver: $($gpu.DriverVersion)"
              Write-Host "Memória: $([math]::Round($gpu.AdapterRAM / 1GB, 2)) GB"

              if ($gpu.Name -match "Microsoft Basic Display") {
                  Write-Warning "GPU básica detectada. Jogos podem não funcionar corretamente."
              }

              if ($gpu.Name -match "Remote Display") {
                  Write-Warning "Adaptador gráfico remoto detectado."
              }
          }

          Write-Host ""
          Write-Host "CPU:"
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host ""
          Write-Host "RAM:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object `
              @{N="TotalGB";E={
                [math]::Round($_.TotalVisibleMemorySize / 1MB, 2)
              }},
              @{N="FreeGB";E={
                [math]::Round($_.FreePhysicalMemory / 1MB, 2)
              }}

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        DIAGNÓSTICO CONCLUÍDO"
          Write-Host "=============================================="

      # ==========================================
      # 8. MANTER RDP ATIVO
      # ==========================================
      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "              RDP ATIVO"
          Write-Host "=============================================="
          Write-Host "Endereço : $env:TAILSCALE_IP"
          Write-Host "Usuário  : $env:RDP_USERNAME"
          Write-Host "Senha    : $env:RDP_PASSWORD"
          Write-Host "=============================================="
          Write-Host ""

          while ($true) {

              $service = Get-Service `
                -Name TermService `
                -ErrorAction SilentlyContinue

              if ($service -and $service.Status -ne "Running") {
                  Write-Host "RDP parado. Reiniciando..."
                  Start-Service TermService
              }

              Write-Host `
                "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP ativo"

              Start-Sleep -Seconds 60
          }g") {
                  Write-Host "RDP parou. Reiniciando..."
                  Start-Service -Name TermService
              }

              Write-Host `
                "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP ativo - IP $env:TAILSCALE_IP"

              Start-Sleep -Seconds 60
          }
