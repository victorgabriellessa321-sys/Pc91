name: Cloud Gaming Windows

on:
  workflow_dispatch:

jobs:
  cloud-gaming:

    # IMPORTANTE:
    # Substitua pelo LABEL REAL do seu runner GPU.
    #
    # Exemplo de configuração GPU do GitHub:
    # Windows + 4 CPU + Tesla T4 + 28 GB RAM + 16 GB VRAM
    #
    # NÃO invente um label se ele não existir na sua organização.
    runs-on: windows-4-core-gpu

    timeout-minutes: 360

    steps:

      # ==================================================
      # 1. DIAGNOSTICO COMPLETO
      # ==================================================
      - name: Diagnostico GPU e Sistema
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       CLOUD GAMING - DIAGNOSTICO"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "========== WINDOWS =========="

          $os = Get-CimInstance Win32_OperatingSystem

          Write-Host "Sistema: $($os.Caption)"
          Write-Host "Versao: $($os.Version)"
          Write-Host "Build: $($os.BuildNumber)"
          Write-Host "Arquitetura: $($os.OSArchitecture)"

          Write-Host ""
          Write-Host "========== CPU =========="

          Get-CimInstance Win32_Processor |
            Select-Object `
              Name,
              NumberOfCores,
              NumberOfLogicalProcessors,
              MaxClockSpeed |
            Format-List

          Write-Host ""
          Write-Host "========== RAM =========="

          $ramTotal = [math]::Round(
            $os.TotalVisibleMemorySize / 1MB,
            2
          )

          $ramFree = [math]::Round(
            $os.FreePhysicalMemory / 1MB,
            2
          )

          Write-Host "RAM Total: $ramTotal GB"
          Write-Host "RAM Livre: $ramFree GB"

          Write-Host ""
          Write-Host "========== GPU =========="

          $gpus = Get-CimInstance Win32_VideoController

          foreach ($gpu in $gpus) {

            $gpuRam = 0

            if ($gpu.AdapterRAM) {
              $gpuRam = [math]::Round(
                $gpu.AdapterRAM / 1GB,
                2
              )
            }

            Write-Host "GPU: $($gpu.Name)"
            Write-Host "Driver: $($gpu.DriverVersion)"
            Write-Host "VRAM reportada: $gpuRam GB"
            Write-Host "Resolucao: $($gpu.VideoModeDescription)"
            Write-Host "Status: $($gpu.Status)"
            Write-Host ""

          }

          Write-Host ""
          Write-Host "========== NVIDIA =========="

          $nvidiaCommand = Get-Command `
            "nvidia-smi.exe" `
            -ErrorAction SilentlyContinue

          if ($nvidiaCommand) {

            Write-Host "nvidia-smi encontrado."

            nvidia-smi

          }
          else {

            Write-Host "nvidia-smi nao encontrado."

          }

          Write-Host ""
          Write-Host "========== DIRECTX =========="

          $dxdiag = "$env:TEMP\dxdiag.txt"

          Start-Process `
            -FilePath "dxdiag.exe" `
            -ArgumentList "/t `"$dxdiag`"" `
            -Wait `
            -ErrorAction SilentlyContinue

          if (Test-Path $dxdiag) {

            Get-Content $dxdiag |
              Select-String `
                "DirectX Version",
                "Card name",
                "Display Memory",
                "Driver Model",
                "Driver Version"

          }

          Write-Host ""
          Write-Host "========== DISCO =========="

          Get-CimInstance Win32_LogicalDisk `
            -Filter "DriveType=3" |
            Select-Object `
              DeviceID,
              @{Name="TotalGB";Expression={
                [math]::Round($_.Size / 1GB, 2)
              }},
              @{Name="FreeGB";Expression={
                [math]::Round($_.FreeSpace / 1GB, 2)
              }} |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "========== REDE =========="

          Get-NetAdapter |
            Where-Object Status -eq "Up" |
            Select-Object `
              Name,
              InterfaceDescription,
              LinkSpeed |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "========== DIAGNOSTICO CONCLUIDO =========="

      # ==================================================
      # 2. CONFIGURAR RDP
      # ==================================================
      - name: Configurar RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $rdpPath = "HKLM:\System\CurrentControlSet\Control\Terminal Server"
          $tcpPath = "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"

          Set-ItemProperty `
            -Path $rdpPath `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Manter NLA ativado
          Set-ItemProperty `
            -Path $tcpPath `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          # TLS
          Set-ItemProperty `
            -Path $tcpPath `
            -Name "SecurityLayer" `
            -Value 1 `
            -Force

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          netsh advfirewall firewall delete rule `
            name="RDP-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          $service = Get-Service `
            -Name TermService

          if ($service.Status -eq "Running") {

            Restart-Service `
              -Name TermService `
              -Force

          }
          else {

            Start-Service `
              -Name TermService

          }

          Start-Sleep -Seconds 3

          Write-Host "RDP configurado."

      # ==================================================
      # 3. CRIAR USUARIO
      # ==================================================
      - name: Criar Usuario Skyro
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $username = "Skyro"

          $upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".ToCharArray()
          $lower = "abcdefghijklmnopqrstuvwxyz".ToCharArray()
          $numbers = "0123456789".ToCharArray()
          $special = "!@#$%^&*()-_=+[]{}:,.?".ToCharArray()

          $passwordChars = @()

          $passwordChars += $upper | Get-Random -Count 4
          $passwordChars += $lower | Get-Random -Count 4
          $passwordChars += $numbers | Get-Random -Count 4
          $passwordChars += $special | Get-Random -Count 4

          $password = -join (
            $passwordChars |
            Sort-Object { Get-Random }
          )

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {

            Remove-LocalUser `
              -Name $username `
              -ErrorAction Stop

          }

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -Description "Cloud Gaming User" `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -UserMayNotChangePassword

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          "RDP_USERNAME=$username" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          "RDP_PASSWORD=$password" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "Usuario criado."

      # ==================================================
      # 4. INSTALAR TAILSCALE
      # ==================================================
      - name: Instalar Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList `
              "/i",
              "`"$installer`"",
              "/quiet",
              "/norestart" `
            -Wait

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale nao foi instalado."
          }

          Write-Host "Tailscale instalado."

      # ==================================================
      # 5. CONECTAR TAILSCALE
      # ==================================================
      - name: Conectar Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace(
            $env:TAILSCALE_AUTH_KEY
          )) {
            throw "Configure o secret TAILSCALE_AUTH_KEY."
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="cloud-gaming-$env:GITHUB_RUN_ID"

          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {

            $tsIP = (
              & $tailscale ip -4 2>$null
            ) |
              Where-Object {
                $_ -match "^\d+\.\d+\.\d+\.\d+$"
              } |
              Select-Object -First 1

            if ($tsIP) {
              break
            }

            Write-Host "Aguardando Tailscale... $i/20"

            Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
            throw "IP do Tailscale nao encontrado."
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File `
              $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

          Write-Host "Tailscale IP: $tsIP"

      # ==================================================
      # 6. VERIFICAR RDP
      # ==================================================
      - name: Verificar RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $service = Get-Service `
            -Name TermService

          if ($service.Status -ne "Running") {

            Start-Service `
              -Name TermService

            Start-Sleep -Seconds 3

          }

          $port = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $port) {
            throw "Porta 3389 nao esta escutando."
          }

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
            throw "RDP nao respondeu."
          }

          Write-Host "RDP funcionando."

      # ==================================================
      # 7. VERIFICAR GPU PARA JOGOS
      # ==================================================
      - name: Verificar Ambiente Gamer
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "          AMBIENTE GAMER"
          Write-Host "=============================================="

          $gpus = Get-CimInstance Win32_VideoController

          $gamingGPU = $false

          foreach ($gpu in $gpus) {

            Write-Host ""
            Write-Host "GPU: $($gpu.Name)"

            if (
              $gpu.Name -match "NVIDIA" -or
              $gpu.Name -match "AMD" -or
              $gpu.Name -match "Radeon"
            ) {

              $gamingGPU = $true

            }

          }

          if ($gamingGPU) {

            Write-Host ""
            Write-Host "GPU para jogos detectada."

          }
          else {

            Write-Warning "GPU gamer nao detectada."
            Write-Warning "O ambiente pode nao conseguir executar jogos 3D."

          }

      # ==================================================
      # 8. VERIFICAR ROBLOX
      # ==================================================
      - name: Verificar Roblox
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "                 ROBLOX"
          Write-Host "=============================================="

          $locations = @(
            "$env:LOCALAPPDATA\Roblox",
            "$env:ProgramFiles\Roblox",
            "${env:ProgramFiles(x86)}\Roblox"
          )

          $roblox = $null

          foreach ($location in $locations) {

            if (Test-Path $location) {

              $roblox = Get-ChildItem `
                -Path $location `
                -Filter "RobloxPlayerBeta.exe" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($roblox) {
                break
              }

            }

          }

          if ($roblox) {

            Write-Host "Roblox encontrado:"
            Write-Host $roblox.FullName

          }
          else {

            Write-Host "Roblox nao esta instalado."

          }

      # ==================================================
      # 9. MOSTRAR ACESSO
      # ==================================================
      - name: Mostrar Acesso
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "             CLOUD GAMING ONLINE"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "IP Tailscale : $env:TAILSCALE_IP"
          Write-Host "Porta        : 3389"
          Write-Host "Usuario      : $env:RDP_USERNAME"
          Write-Host "Senha        : $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "Conecte usando um cliente RDP."
          Write-Host ""
          Write-Host "=============================================="
          Write-Host ""

      # ==================================================
      # 10. MANTER A SESSAO
      # ==================================================
      - name: Manter Cloud Gaming
        shell: powershell
        run: |
          Write-Host "Cloud Gaming ativo."

          while ($true) {

            $service = Get-Service `
              -Name TermService `
              -ErrorAction SilentlyContinue

            if ($service) {

              if ($service.Status -ne "Running") {

                Write-Host "RDP parado. Reiniciando..."

                Start-Service `
                  -Name TermService `
                  -ErrorAction SilentlyContinue

              }

            }

            Write-Host `
              "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Cloud Gaming ativo"

            Start-Sleep -Seconds 60
          }
