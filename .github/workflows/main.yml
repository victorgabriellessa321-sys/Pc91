name: Windows Gaming RDP

on:
  workflow_dispatch:

jobs:
  gaming-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Windows and RDP
        shell: powershell
        run: |
          Write-Host "Configurando Windows para RDP..."

          # Ativar RDP
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Manter NLA ativado
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          # TLS
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 1 `
            -Force

          # Firewall somente para Tailscale
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 `
            remoteip=100.64.0.0/10

          Set-Service TermService -StartupType Automatic
          Restart-Service TermService -Force

      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $username = "YamzzOfficial"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Configure o secret RDP_PASSWORD no GitHub."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($user) {
            Set-LocalUser `
              -Name $username `
              -Password $securePassword
          }
          else {
            New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "Usuário RDP configurado."

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installer -Force

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            throw "Tailscale não foi instalado."
          }

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "Configure o secret TAILSCALE_AUTH_KEY."
          }

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gaming-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Não foi possível conectar ao Tailscale."
          }

          Start-Sleep -Seconds 5

          $ip = (& $tailscale ip -4).Trim()

          if (!$ip) {
            throw "IP do Tailscale não encontrado."
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          Write-Host "================================"
          Write-Host "IP PARA RDP: $ip"
          Write-Host "================================"

      - name: Optimize Windows for Remote Graphics
        shell: powershell
        run: |
          Write-Host "Aplicando otimizações gráficas..."

          # Priorizar aplicações em primeiro plano
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl" `
            -Name "Win32PrioritySeparation" `
            -Value 26 `
            -Force

          # Reduzir efeitos visuais
          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
            -Name "VisualFXSetting" `
            -Value 2 `
            -Force

          # Desativar transparência
          Set-ItemProperty `
            -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
            -Name "EnableTransparency" `
            -Value 0 `
            -Force

          Write-Host "Otimizações aplicadas."

      - name: Install DirectX Runtime
        shell: powershell
        run: |
          Write-Host "Instalando componentes comuns para jogos..."

          $url = "https://download.microsoft.com/download/1/1/C/11C1F7B5-9B7D-4A0B-9A6C-4E1E1E1E1E1E/dxwebsetup.exe"
          $file = "$env:TEMP\dxwebsetup.exe"

          try {
            Invoke-WebRequest `
              -Uri $url `
              -OutFile $file `
              -ErrorAction Stop

            Start-Process `
              $file `
              -ArgumentList "/Q" `
              -Wait
          }
          catch {
            Write-Host "DirectX Web Installer não foi necessário ou não pôde ser baixado."
          }

          Remove-Item $file -Force -ErrorAction SilentlyContinue

      - name: Check Graphics Hardware
        shell: powershell
        run: |
          Write-Host "=============================="
          Write-Host "GPU"
          Write-Host "=============================="

          Get-CimInstance Win32_VideoController |
            Select-Object Name, AdapterRAM, DriverVersion

          Write-Host ""
          Write-Host "CPU"

          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host ""
          Write-Host "RAM"

          Get-CimInstance Win32_ComputerSystem |
            Select-Object @{N="RAM_GB";E={[math]::Round($_.TotalPhysicalMemory / 1GB,2)}}

      - name: Verify RDP
        shell: powershell
        run: |
          Write-Host "=============================="
          Write-Host "RDP DISPONIVEL"
          Write-Host "=============================="

          Write-Host "IP Tailscale: $env:TAILSCALE_IP"
          Write-Host "Usuário: YamzzOfficial"
          Write-Host "Porta: 3389"

          Get-Service TermService |
            Select-Object Status, StartType

          Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen |
            Select-Object LocalAddress, LocalPort, State

      - name: Keep Runner Online
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host " WINDOWS PRONTO PARA RDP"
          Write-Host "======================================"
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "Usuário: YamzzOfficial"
          Write-Host "======================================"
          Write-Host ""
          Write-Host "O runner ficará ativo por até 6 horas."

          Start-Sleep -Seconds 21600
